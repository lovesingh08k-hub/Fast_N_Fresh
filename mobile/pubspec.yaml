name: fast_n_fresh_cafe
description: Fast N Fresh Cafe - Cafe Management & POS Application
publish_to: 'none'
version: 1.1.0+4

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Networking
  dio: ^5.5.0+1

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Push notifications (new-order alerts even while the app is fully closed)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1

  # PDF / printing / sharing
  pdf: ^3.11.0
  printing: ^5.13.1
  share_plus: ^10.0.0
  path_provider: ^2.1.3

  # Bluetooth thermal receipt printer (58mm/80mm ESC/POS) — used for
  # printing the bill/order at the counter instead of the A4/PDF print
  # dialog above, which is kept only for the "PDF" / "Share" actions.
  print_bluetooth_thermal: ^1.1.4
  esc_pos_utils_plus: ^2.0.4

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.2

  # Product photo upload
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  connectivity_plus: ^6.0.5
  package_info_plus: ^8.0.2

  # New-order notifications
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # App launcher icon generator
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# App launcher icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21